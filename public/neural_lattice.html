<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkTrace // 3D WebGL Neural Lattice Topology</title>

  <!-- Google Fonts & Three.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-cosmic: #030712;
      --card-glass: rgba(15, 23, 42, 0.7);
      --border-glass: rgba(245, 158, 11, 0.3);
      --holo-gold: #F59E0B;
      --plasma-blue: #3B82F6;
      --glowing-emerald: #10B981;
      --text-main: #F8FAFC;
      --font-ui: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-cosmic);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* 3D WebGL Canvas */
    #webglCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Header Bar */
    header {
      position: absolute;
      top: 1.5rem; left: 2rem; right: 2rem;
      z-index: 20;
      display: flex; justify-between; align-items: center;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 1rem 1.75rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-title {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(90deg, #FFF, var(--holo-gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--glowing-emerald);
      padding: 0.45rem 1rem; border-radius: 30px;
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
    }

    /* Floating Controls Bar */
    .control-halo {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 20;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 40px;
      padding: 0.6rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }
    .halo-input {
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px; padding: 0.6rem 1.2rem;
      color: #FFF; font-family: var(--font-mono); font-size: 0.8rem; outline: none; width: 280px;
    }
    .halo-btn {
      background: linear-gradient(135deg, var(--holo-gold), var(--plasma-blue));
      border: none; color: #000; font-weight: 800; font-size: 0.8rem;
      padding: 0.65rem 1.4rem; border-radius: 20px; cursor: pointer;
    }

    /* Speaker Drawer Overlay */
    .drawer-overlay {
      position: absolute; top: 0; right: 0; bottom: 0; width: 400px;
      background: rgba(8, 14, 26, 0.9); backdrop-filter: blur(24px);
      border-left: 1px solid var(--border-glass); z-index: 30;
      padding: 2.5rem 2rem; transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; gap: 1.5rem;
    }
    .drawer-overlay.active { transform: translateX(0); }

    /* Security Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px);
      z-index: 40; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: rgba(15, 23, 42, 0.95); border: 1px solid var(--holo-gold);
      border-radius: 24px; padding: 2rem; width: 90%; max-width: 520px;
    }
  </style>
</head>
<body>

  <!-- WebGL 3D Canvas -->
  <canvas id="webglCanvas"></canvas>

  <!-- Top Header Bar -->
  <header>
    <div class="brand">
      <span class="brand-title">TalkTrace 3D Topology</span>
    </div>
    <div class="status-badge">
      <span>● Zero-Knowledge 3D WebGL Vault</span>
    </div>
  </header>

  <!-- Radial Bottom Control Bar -->
  <div class="control-halo">
    <input type="text" class="halo-input" value="https://meet.google.com/abc-defg-hij">
    <button class="halo-btn" onclick="alert('Bot injected into 3D Space!')">Inject Bot</button>
    <button class="halo-btn" style="background: rgba(255,255,255,0.1); color: #FFF;" onclick="openModal()">Vault Specs</button>
  </div>

  <!-- Speaker Drawer -->
  <div class="drawer-overlay" id="drawer">
    <h3 style="color: var(--holo-gold);" id="spkName">Speaker Details</h3>
    <p style="font-size: 0.85rem; color: #94A3B8;">3D Spatial Waveform & Transcript Active</p>
    <button onclick="closeDrawer()" style="padding: 0.5rem; background: rgba(255,255,255,0.1); color:#FFF; border:none; border-radius:8px; cursor:pointer;">Close</button>
  </div>

  <!-- Security Vault Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h3 style="color: var(--holo-gold); margin-bottom: 1rem;">🛡️ AES-256 Vault 3D Specs</h3>
      <p style="font-size: 0.8rem; color: var(--glowing-emerald); font-family: var(--font-mono);">
        SHA-256 Data Hash: 8a7f92bc3e1d4590a1f87e24b901c563e4129b09f7a83c1d92e541b2a90187c3
      </p>
      <button class="halo-btn" style="width: 100%; margin-top: 1.5rem;" onclick="closeModal()">Close Vault</button>
    </div>
  </div>

  <script>
    // THREE.JS 3D SPATIAL TOPOLOGY SCENE
    const canvas = document.getElementById('webglCanvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 18);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xF59E0B, 2, 50);
    pointLight.position.set(0, 0, 5);
    scene.add(pointLight);

    // Central AES-256 Security Sphere (Holographic Orb)
    const sphereGeo = new THREE.SphereGeometry(2.2, 32, 32);
    const sphereMat = new THREE.MeshPhongMaterial({
      color: 0xF59E0B,
      wireframe: true,
      emissive: 0x3B82F6,
      emissiveIntensity: 0.5
    });
    const centralSphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(centralSphere);

    // Floating Speaker Nodes (3D Orbs with Audio Frequency Rings)
    const speakerNodes = [
      { name: "Abin George", pos: [-6, 3, 0], color: 0xF59E0B },
      { name: "Sarah Jenkins", pos: [6, 2, -2], color: 0x3B82F6 },
      { name: "David Miller", pos: [-4, -4, 1], color: 0x10B981 }
    ];

    const nodeMeshes = [];

    speakerNodes.forEach(spk => {
      const geo = new THREE.SphereGeometry(0.9, 24, 24);
      const mat = new THREE.MeshStandardMaterial({ color: spk.color, roughness: 0.2 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...spk.pos);
      scene.add(mesh);
      nodeMeshes.push(mesh);

      // Plasma Energy Line to Center
      const lineMat = new THREE.LineDashedMaterial({ color: spk.color, dashSize: 0.3, gapSize: 0.2 });
      const points = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(...spk.pos)];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(lineGeo, lineMat);
      scene.add(line);
    });

    // 360 Camera Orbit Animation Loop
    let angle = 0;
    function animate() {
      requestAnimationFrame(animate);

      centralSphere.rotation.y += 0.01;
      centralSphere.rotation.x += 0.005;

      nodeMeshes.forEach((m, idx) => {
        m.position.y += Math.sin(Date.now() * 0.002 + idx) * 0.005;
      });

      angle += 0.002;
      camera.position.x = 18 * Math.cos(angle);
      camera.position.z = 18 * Math.sin(angle);
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function openModal() { document.getElementById('modal').classList.add('active'); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function closeDrawer() { document.getElementById('drawer').classList.remove('active'); }
  </script>
</body>
</html>
